[project]
name = "crypto-trading-lab"
version = "0.0.1"
description = "Transparent AI-driven paper-trading and backtest platform for crypto (CryptoCadence). Capability showcase — no real money by default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Deliberately dependency-light: the quant engine is pure Python (no pandas/numpy
# black boxes) and the data layer uses the standard-library HTTP client, so the
# whole thing is auditable and testable offline. pyyaml loads the config/ files.
#
# cadence-core is the shared kernel of the Cadence platform (judgment contract,
# calibration math, HTTP transport, context digest). Pinned to a tag, not a
# branch, so the daily paper-loop stays reproducible; bump it deliberately.
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "cadence-core @ git+https://github.com/cadence-trading/cadence-core@v0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# cadence-core is consumed as a git reference (see `dependencies` above), which
# hatchling only allows when this flag is set.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

# Planned deps (later phases), kept here as documentation:
#   Fase 3: the Jev client uses the standard-library HTTP client (no SDK), by design.
#   Fase 5: fastapi, uvicorn
